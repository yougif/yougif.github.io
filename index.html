<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://yougif.pages.dev/" />
    <meta http-equiv="refresh" content="0; url=https://yougif.pages.dev/" />
    <title>Yougif has moved</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080a0f;
        color: #f7f8fb;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 2rem;
      }
      main {
        max-width: 34rem;
        display: grid;
        gap: 1rem;
      }
      a {
        color: #58d7f7;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yougif site has moved</h1>
      <p>The canonical Yougif site is now served from Cloudflare Pages.</p>
      <p><a href="https://yougif.pages.dev/">https://yougif.pages.dev/</a></p>
    </main>
    <script>
      const target = new URL("https://yougif.pages.dev/");
      target.pathname = window.location.pathname;
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    </script>
  </body>
</html>
